<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Browserino</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data:">
<style>
:root{--bg:#0e1117;--bar:#171c26;--line:#2a3142;--tx:#e8ecf4;--mut:#8b94a7;--ac:#e5484d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px system-ui,Segoe UI,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#bar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--bar);border-bottom:1px solid var(--line)}
body.player #bar,body.player #tabs{display:none}
#tabs{display:flex;gap:4px;align-items:flex-end;padding:6px 8px 0;background:#0b0e14;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;min-width:90px;max-width:210px;flex:0 1 210px;height:32px;padding:0 6px 0 12px;border-radius:9px 9px 0 0;background:#141925;color:var(--mut);cursor:pointer;font-size:13px}
.tab:hover{background:#1b2232}.tab.act{background:var(--bar);color:var(--tx)}
.tab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab i{font-style:normal;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font-size:11px}.tab i:hover{background:#ffffff22}
#tabnew{min-width:32px;width:32px;height:28px;margin-bottom:2px;background:none;font-size:18px}
button{background:#232a3a;color:var(--tx);border:0;border-radius:8px;min-width:36px;height:34px;font-size:15px;cursor:pointer}
button:hover{background:#2d3650}button:disabled{opacity:.35}button.on{background:var(--ac)}
#addr{flex:1;height:34px;border-radius:8px;border:1px solid var(--line);background:#0b0e14;color:var(--tx);padding:0 12px;font:inherit}
#shield{min-width:64px;font-size:13px}
#stage{position:relative;flex:1}
webview{position:absolute;inset:0;width:100%;height:100%;background:#fff}
webview.bg{visibility:hidden;pointer-events:none}
#home{position:absolute;inset:0;padding:40px 8vw;overflow:auto}
#home h1{margin:0 0 4px;font-size:28px}#home h1 b{color:var(--ac)}#home p{color:var(--mut);margin:0 0 26px}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.tile{background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;position:relative}
.tile:hover{border-color:var(--ac)}.tile b{display:block;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{color:var(--mut);font-size:12px;word-break:break-all}.tile i{position:absolute;right:8px;top:6px;color:var(--mut);font-style:normal}
.tile i:hover{color:var(--ac)}
#vid.on{background:#2f7d4f}
#demo{min-width:78px;font-size:13px;background:#8a5a00}#demo:hover{background:#a56d00}
#vdemo{color:#f0b34a;font-size:12px;padding:4px 2px;line-height:1.35}
#rec{min-width:78px;font-size:13px}#rec.rec{background:var(--ac);animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.6}}
#vpanel{position:absolute;right:10px;top:8px;width:min(560px,94vw);max-height:72vh;overflow:auto;background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:20;box-shadow:0 12px 34px #000a}
#vhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}#vhead b{flex:1;font-size:15px}
.vrow{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:#0b0e14;margin-bottom:6px}
.vrow .vi{flex:1;min-width:0}.vrow .vl{font-weight:600}.vrow .vh{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vempty{color:var(--mut);padding:8px;line-height:1.4}
#dlist:not(:empty){margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dh{color:var(--mut);font-size:12px;margin:2px 2px 6px}
.drow{background:#0b0e14;border-radius:8px;padding:8px;margin-bottom:6px}
.dtop{display:flex;align-items:center;gap:6px}.dname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtop button{min-width:32px;height:28px;font-size:13px}
.dbar{height:5px;border-radius:3px;background:#232a3a;margin:7px 0 4px;overflow:hidden}.dbar i{display:block;height:100%;width:0;background:#4c8dff;transition:width .3s}
.drow.done .dbar i{background:#2f7d4f}.drow.err .dbar i{background:var(--ac)}.drow.paused .dbar i{background:#8a5a00}
.dtxt{color:var(--mut);font-size:12px;line-height:1.35}
#vlogbar{display:flex;gap:8px;align-items:center;margin:6px 0}#vlogbar span{color:var(--mut);font-size:12px}
#vlog{width:100%;height:36vh;background:#05070b;color:#b8c2d6;border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.35 Consolas,monospace;resize:vertical;white-space:pre}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.hide{display:none!important}
</style></head><body>
<div id="app">
  <div id="tabs"></div>
  <div id="bar">
    <button id="back" title="Indietro (Alt+←)">←</button>
    <button id="fwd" title="Avanti">→</button>
    <button id="reload" title="Ricarica (F5)">⟳</button>
    <button id="homeBtn" title="Home">⌂</button>
    <input id="addr" spellcheck="false" placeholder="Cerca o scrivi un indirizzo (Ctrl+L)">
    <button id="fav" title="Aggiungi ai preferiti (Ctrl+D)">☆</button>
    <button id="jump" title="Blocca i salti di pagina verso altri siti">⛔ salti</button>
    <button id="rec" title="Registra tutto l'audio che esce dalle casse (Ctrl+Maiusc+R). Premi di nuovo per fermare e salvare in Download">⏺ REC</button>
    <button id="demo" class="hide" title="Versione demo: i download salvano solo una parte del video e REC dura 2 minuti. Clic per sbloccare la versione completa">🔓 DEMO</button>
    <button id="vid" title="Video trovati nella pagina: player pulito e download">🎬 0</button>
    <button id="shield" title="Pubblicità e popup bloccati">🛡 0</button>
  </div>
  <div id="stage">
    <div id="home">
      <h1>Brow<b>serino</b></h1><p>Preferiti. Clic per aprire, ✕ per toglierli.</p>
      <div id="tiles"></div>
    </div>
    <div id="vpanel" class="hide">
      <div id="vhead"><b>🎬 Video trovati</b><button id="vscan" title="Cerca di nuovo nel codice della pagina">⟳ Scansiona</button><button id="vlogbtn" title="Mostra il log per capire cosa va storto">🐞 Log</button><button id="vclose">✕</button></div>
      <div id="vdemo" class="hide"></div><div id="dlist"></div><div id="vlist"></div>
      <div id="vlogbox" class="hide">
        <div id="vlogbar"><button id="vcopy">📋 Copia</button><button id="vlogfile">📂 Apri file</button><span>Incolla il log in chat se un download non va.</span></div>
        <textarea id="vlog" readonly spellcheck="false"></textarea>
      </div>
    </div>
    <div id="toast"></div>
  </div>
</div>
<script src="app.js"></script>
<script src="rec.js"></script>
</body></html>
